<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KizuLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .setup-card { max-width: 640px; margin: 60px auto; }
        .step { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.875rem; }
        .step.active { background-color: #0d6efd; color: white; }
        .step.done { background-color: #198754; color: white; }
        .step.todo { background-color: #dee2e6; color: #6c757d; }
        .step-line { flex: 1; height: 2px; background-color: #dee2e6; margin: 0 8px; }
    </style>
</head>
<body>
<div class="setup-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i><span th:text="#{setup.title}"></span>
        </h1>
        <p class="text-muted mb-0" th:text="#{setup.subtitle}"></p>
    </div>

    <div class="d-flex align-items-center justify-content-center mb-4">
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step active">1</div>
        <div class="step-line"></div>
        <div class="step todo">2</div>
        <div class="step-line"></div>
        <div class="step todo">3</div>
        <div class="step-line"></div>
        <div class="step todo">4</div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-1" th:text="#{setup.step1.title}"></h5>
            <p class="text-muted small mb-4" th:text="#{setup.step1.description}"></p>

            <form th:action="@{/setup/step1}" method="post" id="step1Form">

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-check2-square me-1"></i>
                        <span th:text="#{setup.step1.label.availableLanguages}"></span>
                        <span class="text-danger">*</span>
                    </label>
                    <div class="border rounded p-3 bg-light">
                        <div th:each="lang : ${languages}" class="form-check">
                            <input type="checkbox" class="form-check-input lang-checkbox"
                                   name="availableLanguages"
                                   th:value="${lang.name()}"
                                   th:id="${'lang-' + lang.name()}"
                                   th:data-name="${lang.displayName}"
                                   th:checked="${sessionData.availableLanguages.contains(lang)}"/>
                            <label class="form-check-label"
                                   th:for="${'lang-' + lang.name()}"
                                   th:text="${lang.displayName}"></label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-translate me-1"></i>
                        <span th:text="#{setup.step1.label.defaultLanguage}"></span>
                        <span class="text-danger">*</span>
                    </label>
                    <select name="defaultLanguage" id="defaultLanguage" class="form-select" required>
                    </select>
                </div>

                <hr class="my-4"/>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-check2-square me-1"></i>
                        <span th:text="#{setup.step1.label.availableTimezones}"></span>
                        <span class="text-danger">*</span>
                    </label>
                    <div class="border rounded p-3 bg-light">
                        <div th:each="tz : ${timezones}" class="form-check">
                            <input type="checkbox" class="form-check-input tz-checkbox"
                                   name="availableTimezones"
                                   th:value="${tz.name()}"
                                   th:id="${'tz-' + tz.name()}"
                                   th:data-name="${tz.displayName}"
                                   th:checked="${sessionData.availableTimezones.contains(tz)}"/>
                            <label class="form-check-label"
                                   th:for="${'tz-' + tz.name()}"
                                   th:text="${tz.displayName}"></label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-clock me-1"></i>
                        <span th:text="#{setup.step1.label.defaultTimezone}"></span>
                        <span class="text-danger">*</span>
                    </label>
                    <select name="defaultTimezone" id="defaultTimezone" class="form-select" required>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/setup/step0" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i>
                        <span th:text="#{setup.button.back}"></span>
                    </a>
                    <button type="submit" class="btn btn-primary px-4" id="nextBtn" disabled>
                        <span th:text="#{setup.button.next}"></span>
                        <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const savedDefaultLang = /*[[${sessionData.defaultLanguage != null ? sessionData.defaultLanguage.name() : ''}]]*/ '';
    const savedDefaultTz   = /*[[${sessionData.defaultTimezone != null ? sessionData.defaultTimezone.name() : ''}]]*/ '';

    function refreshSelect(checkboxClass, selectId, savedValue) {
        const select = document.getElementById(selectId);
        const previousValue = select.value || savedValue;
        select.innerHTML = '';

        const checked = document.querySelectorAll('.' + checkboxClass + ':checked');
        checked.forEach(cb => {
            const opt = document.createElement('option');
            opt.value = cb.value;
            opt.textContent = cb.dataset.name;
            if (cb.value === previousValue) {
                opt.selected = true;
            }
            select.appendChild(opt);
        });
    }

    function updateNextButton() {
        const langChecked = document.querySelectorAll('.lang-checkbox:checked').length > 0;
        const tzChecked   = document.querySelectorAll('.tz-checkbox:checked').length > 0;
        const langSelected = document.getElementById('defaultLanguage').value !== '';
        const tzSelected   = document.getElementById('defaultTimezone').value !== '';
        document.getElementById('nextBtn').disabled =
            !(langChecked && tzChecked && langSelected && tzSelected);
    }

    // 初期表示
    refreshSelect('lang-checkbox', 'defaultLanguage', savedDefaultLang);
    refreshSelect('tz-checkbox', 'defaultTimezone', savedDefaultTz);
    updateNextButton();

    // 変更時のリフレッシュ
    document.querySelectorAll('.lang-checkbox').forEach(cb => {
        cb.addEventListener('change', () => {
            refreshSelect('lang-checkbox', 'defaultLanguage', savedDefaultLang);
            updateNextButton();
        });
    });
    document.querySelectorAll('.tz-checkbox').forEach(cb => {
        cb.addEventListener('change', () => {
            refreshSelect('tz-checkbox', 'defaultTimezone', savedDefaultTz);
            updateNextButton();
        });
    });
    document.getElementById('defaultLanguage').addEventListener('change', updateNextButton);
    document.getElementById('defaultTimezone').addEventListener('change', updateNextButton);
</script>
</body>
</html>
