<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KizuLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .setup-card { max-width: 640px; margin: 60px auto; }
        .step { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.875rem; }
        .step.active { background-color: #0d6efd; color: white; }
        .step.done { background-color: #198754; color: white; }
        .step.todo { background-color: #dee2e6; color: #6c757d; }
        .step-line { flex: 1; height: 2px; background-color: #dee2e6; margin: 0 8px; }
    </style>
</head>
<body>
<div class="setup-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i><span th:text="#{setup.title}"></span>
        </h1>
        <p class="text-muted mb-0" th:text="#{setup.subtitle}"></p>
    </div>

    <div class="d-flex align-items-center justify-content-center mb-4">
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step active">3</div>
        <div class="step-line"></div>
        <div class="step todo">4</div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-1" th:text="#{setup.step3.title}"></h5>
            <p class="text-muted small mb-4" th:text="#{setup.step3.description}"></p>

            <!-- ログイン済みの場合 -->
            <div th:if="${sessionData.adminSub != null}" class="mb-4">
                <div class="alert alert-success">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="#{setup.step3.loggedIn}"></span>
                </div>
                <div class="border rounded p-3 bg-light small">
                    <div class="row g-2">
                        <div class="col-4 text-muted" th:text="#{setup.step3.label.iss}"></div>
                        <div class="col-8 text-break" th:text="${sessionData.adminIss}"></div>
                        <div class="col-4 text-muted" th:text="#{setup.step3.label.aud}"></div>
                        <div class="col-8" th:text="${sessionData.adminAud}"></div>
                        <div class="col-4 text-muted" th:text="#{setup.step3.label.sub}"></div>
                        <div class="col-8 text-break" th:text="${sessionData.adminSub}"></div>
                    </div>
                </div>
            </div>

            <!-- 未ログインの場合 -->
            <div th:if="${sessionData.adminSub == null}" class="mb-4">
                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>
                    <span th:text="#{setup.step3.description}"></span>
                </div>
                <div class="text-center">
                    <a th:href="@{/setup/oidc-login}" class="btn btn-primary px-4">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        <span th:text="#{setup.step3.button.login}"></span>
                    </a>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/setup/step2" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i>
                    <span th:text="#{setup.button.back}"></span>
                </a>
                <a th:href="@{/setup/step4}"
                   class="btn btn-primary px-4"
                   th:classappend="${sessionData.adminSub == null} ? 'disabled' : ''">
                    <span th:text="#{setup.button.next}"></span>
                    <i class="bi bi-arrow-right ms-1"></i>
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
