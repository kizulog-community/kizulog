<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KizuLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .setup-card { max-width: 640px; margin: 60px auto; }
        .countdown {
            display: inline-block;
            min-width: 1.5em;
            font-weight: bold;
            color: #0d6efd;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
<div class="setup-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i><span th:text="#{setup.title}"></span>
        </h1>
    </div>

    <div class="card shadow-sm text-center">
        <div class="card-body p-5">
            <div class="mb-3">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
            </div>
            <h4 class="fw-bold mb-2" th:text="#{setup.complete.title}"></h4>
            <p class="text-muted mb-4" th:text="#{setup.complete.message}"></p>

            <hr class="my-4">

            <!-- リダイレクト案内 -->
            <p class="text-muted small mb-3">
                <i class="bi bi-info-circle me-1"></i>
                <span th:utext="#{setup.complete.redirect.message(${'<span class=&quot;countdown&quot; id=&quot;countdown&quot;>10</span>'})}">
                    10秒後にダッシュボードへ自動的に移動します。
                </span>
            </p>

            <a th:href="@{/system/dashboard}"
               class="btn btn-primary btn-sm"
               id="redirect-now">
                <i class="bi bi-arrow-right-circle me-1"></i>
                <span th:text="#{setup.complete.redirect.button}">今すぐ移動</span>
            </a>
        </div>
    </div>
</div>

<!-- JavaScript無効環境用 fallback -->
<noscript>
    <meta http-equiv="refresh" content="10;url=/system/dashboard">
</noscript>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        var redirectUrl = /*[[@{/system/dashboard}]]*/ '/system/dashboard';
        var seconds = 10;
        var countdownEl = document.getElementById('countdown');

        var intervalId = setInterval(function () {
            seconds--;
            if (countdownEl) {
                countdownEl.textContent = seconds;
            }
            if (seconds <= 0) {
                clearInterval(intervalId);
                window.location.href = redirectUrl;
            }
        }, 1000);
    })();
    /*]]>*/
</script>
</body>
</html>
