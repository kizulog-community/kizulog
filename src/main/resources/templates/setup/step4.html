<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KizuLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .setup-card { max-width: 640px; margin: 60px auto; }
        .step { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.875rem; }
        .step.active { background-color: #0d6efd; color: white; }
        .step.done { background-color: #198754; color: white; }
        .step-line { flex: 1; height: 2px; background-color: #dee2e6; margin: 0 8px; }
    </style>
</head>
<body>
<div class="setup-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i><span th:text="#{setup.title}"></span>
        </h1>
        <p class="text-muted mb-0" th:text="#{setup.subtitle}"></p>
    </div>

    <div class="d-flex align-items-center justify-content-center mb-4">
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step active">4</div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-1" th:text="#{setup.step4.title}"></h5>
            <p class="text-muted small mb-4" th:text="#{setup.step4.description}"></p>

            <!-- OIDC設定 -->
            <h6 class="fw-semibold mb-2">
                <i class="bi bi-key me-1"></i>
                <span th:text="#{setup.step4.section.oidc}"></span>
            </h6>
            <div class="border rounded p-3 mb-3 bg-light small">
                <div class="row g-2">
                    <div class="col-4 text-muted" th:text="#{setup.step4.label.host}"></div>
                    <div class="col-8" th:text="${sessionData.host}"></div>
                    <div th:each="oidc : ${sessionData.oidcSettings}">
                        <div class="col-4 text-muted" th:text="#{setup.step4.label.uri}"></div>
                        <div class="col-8 text-break" th:text="${oidc.uri}"></div>
                        <div class="col-4 text-muted" th:text="#{setup.step4.label.clientId}"></div>
                        <div class="col-8" th:text="${oidc.clientId}"></div>
                        <div class="col-4 text-muted" th:text="#{setup.step4.label.clientSecret}"></div>
                        <div class="col-8 text-muted" th:text="#{setup.step4.secret.mask}"></div>
                    </div>
                </div>
            </div>

            <!-- 言語設定 -->
            <h6 class="fw-semibold mb-2 mt-3">
                <i class="bi bi-translate me-1"></i>
                <span th:text="#{setup.step4.section.language}"></span>
            </h6>
            <div class="border rounded p-3 mb-3 bg-light small">
                <div class="row g-2">
                    <div class="col-4 text-muted" th:text="#{setup.step4.label.defaultLanguage}"></div>
                    <div class="col-8" th:text="${sessionData.defaultLanguage?.displayName}"></div>
                    <div class="col-4 text-muted" th:text="#{setup.step4.label.availableLanguages}"></div>
                    <div class="col-8">
                        <span th:each="lang, stat : ${sessionData.availableLanguages}">
                            <span th:text="${lang.displayName}"></span>
                            <span th:if="${!stat.last}">、</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- タイムゾーン設定 -->
            <h6 class="fw-semibold mb-2 mt-3">
                <i class="bi bi-clock me-1"></i>
                <span th:text="#{setup.step4.section.timezone}"></span>
            </h6>
            <div class="border rounded p-3 mb-3 bg-light small">
                <div class="row g-2">
                    <div class="col-4 text-muted" th:text="#{setup.step4.label.defaultTimezone}"></div>
                    <div class="col-8" th:text="${sessionData.defaultTimezone?.displayName}"></div>
                    <div class="col-4 text-muted" th:text="#{setup.step4.label.availableTimezones}"></div>
                    <div class="col-8">
                        <span th:each="tz, stat : ${sessionData.availableTimezones}">
                            <span th:text="${tz.displayName}"></span>
                            <span th:if="${!stat.last}">、</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- 初期管理者 -->
            <h6 class="fw-semibold mb-2 mt-3">
                <i class="bi bi-person-fill-gear me-1"></i>
                <span th:text="#{setup.step4.section.admin}"></span>
            </h6>
            <div class="border rounded p-3 mb-4 bg-light small">
                <div class="row g-2">
                    <div class="col-4 text-muted" th:text="#{setup.step4.label.iss}"></div>
                    <div class="col-8 text-break" th:text="${sessionData.adminIss}"></div>
                    <div class="col-4 text-muted" th:text="#{setup.step4.label.aud}"></div>
                    <div class="col-8" th:text="${sessionData.adminAud}"></div>
                    <div class="col-4 text-muted" th:text="#{setup.step4.label.sub}"></div>
                    <div class="col-8 text-break" th:text="${sessionData.adminSub}"></div>
                </div>
            </div>

            <form th:action="@{/setup/step4}" method="post">
                <div class="d-flex justify-content-between">
                    <a href="/setup/step3" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i>
                        <span th:text="#{setup.button.back}"></span>
                    </a>
                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-check-circle me-1"></i>
                        <span th:text="#{setup.button.save}"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
