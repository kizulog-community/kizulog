<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KizuLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .setup-card { max-width: 640px; margin: 60px auto; }
        .step { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.875rem; }
        .step.active { background-color: #0d6efd; color: white; }
        .step.done { background-color: #198754; color: white; }
        .step.todo { background-color: #dee2e6; color: #6c757d; }
        .step-line { flex: 1; height: 2px; background-color: #dee2e6; margin: 0 8px; }
    </style>
</head>
<body>
<div class="setup-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i><span th:text="#{setup.title}"></span>
        </h1>
        <p class="text-muted mb-0" th:text="#{setup.subtitle}"></p>
    </div>

    <div class="d-flex align-items-center justify-content-center mb-4">
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step active">2</div>
        <div class="step-line"></div>
        <div class="step todo">3</div>
        <div class="step-line"></div>
        <div class="step todo">4</div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-1" th:text="#{setup.step2.title}"></h5>
            <p class="text-muted small mb-4" th:text="#{setup.step2.description}"></p>

            <form th:action="@{/setup/step2}"
                  th:object="${step2FormData}"
                  method="post"
                  id="step2Form"
                  novalidate>

                <!-- グローバルエラー表示（接続失敗等） -->
                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger small mb-3">
                    <i class="bi bi-exclamation-triangle me-1"></i>
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.globalErrors()}"
                            th:text="${err}">エラー</li>
                    </ul>
                </div>


                <!-- ホスト名 -->
                <div class="mb-3">
                    <label for="hostInput" class="form-label fw-semibold">
                        <i class="bi bi-globe2 me-1"></i>
                        <span th:text="#{setup.step2.label.host}">ホスト名</span>
                        <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           id="hostInput"
                           th:field="*{host}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('host')} ? 'is-invalid' : ''"
                           th:placeholder="#{setup.step2.placeholder.host}"
                           required/>
                    <div class="form-text" th:text="#{setup.step2.help.host}">
                        KizuLogが運用されるドメイン名を入力してください。
                    </div>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('host')}"
                         th:errors="*{host}">エラー</div>
                </div>

                <hr class="my-4"/>

                <div class="border rounded p-3 mb-3 bg-light">
                    <h6 class="mb-3">
                        <i class="bi bi-key me-1"></i>OIDC
                    </h6>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <span th:text="#{setup.step2.label.uri}"></span>
                            <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <input type="url"
                                   th:field="*{oidcSetting.uri}"
                                   id="oidcUri"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('oidcSetting.uri')} ? 'is-invalid' : ''"
                                   th:placeholder="#{setup.step2.placeholder.uri}"
                                   required/>
                            <button type="button" class="btn btn-outline-secondary"
                                    id="checkBtn"
                                    onclick="checkOidc()">
                                <i class="bi bi-wifi me-1"></i>
                                <span th:text="#{setup.step2.button.checkConnection}"></span>
                            </button>
                        </div>
                        <div id="oidcResult" class="mt-1 small"></div>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('oidcSetting.uri')}"
                             th:errors="*{oidcSetting.uri}">エラー</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <span th:text="#{setup.step2.label.clientId}"></span>
                            <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               th:field="*{oidcSetting.clientId}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('oidcSetting.clientId')} ? 'is-invalid' : ''"
                               th:placeholder="#{setup.step2.placeholder.clientId}"
                               required/>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('oidcSetting.clientId')}"
                             th:errors="*{oidcSetting.clientId}">エラー</div>
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-semibold">
                            <span th:text="#{setup.step2.label.clientSecret}"></span>
                            <span class="text-danger">*</span>
                        </label>
                        <input type="password"
                               th:field="*{oidcSetting.clientSecret}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('oidcSetting.clientSecret')} ? 'is-invalid' : ''"
                               th:placeholder="#{setup.step2.placeholder.clientSecret}"
                               required/>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('oidcSetting.clientSecret')}"
                             th:errors="*{oidcSetting.clientSecret}">エラー</div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/setup/step1" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i>
                        <span th:text="#{setup.button.back}"></span>
                    </a>
                    <button type="submit" class="btn btn-primary px-4"
                            id="nextBtn"
                            disabled>
                        <span th:text="#{setup.button.next}"></span>
                        <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 共通フッタ（S.0シリーズで追加） -->
<footer th:replace="~{common/fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const i18n = {
        checking:        /*[[#{setup.step2.checking}]]*/ '',
        success:         /*[[#{oidc.success}]]*/ '',
        errorInput:      /*[[#{oidc.error.input}]]*/ '',
        errorUnexpected: /*[[#{oidc.error.unexpected}]]*/ ''
    };

    // 既存のOIDC設定がある（=以前確認済み）場合は接続確認済みとして扱う
    const existingUri = /*[[${step2FormData.oidcSetting != null and step2FormData.oidcSetting.uri != null ? step2FormData.oidcSetting.uri : ''}]]*/ '';
    if (existingUri) {
        document.getElementById('nextBtn').disabled = false;
        document.getElementById('oidcResult').innerHTML =
            '<span class="text-success"><i class="bi bi-check-circle me-1"></i>' + i18n.success + '</span>';
    }

    // URIが変更されたら接続確認をリセット
    document.getElementById('oidcUri').addEventListener('input', function() {
        document.getElementById('oidcResult').innerHTML = '';
        document.getElementById('nextBtn').disabled = true;
    });

    function checkOidc() {
        const issuerUri = document.getElementById('oidcUri').value;
        const resultDiv = document.getElementById('oidcResult');
        const nextBtn   = document.getElementById('nextBtn');
        const checkBtn  = document.getElementById('checkBtn');

        if (!issuerUri) {
            resultDiv.innerHTML =
                '<span class="text-danger"><i class="bi bi-exclamation-circle me-1"></i>' + i18n.errorInput + '</span>';
            nextBtn.disabled = true;
            return;
        }

        resultDiv.innerHTML =
            '<span class="text-muted"><i class="bi bi-arrow-repeat me-1"></i>' + i18n.checking + '</span>';
        checkBtn.disabled = true;

        fetch('/setup/check-oidc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ issuerUri: issuerUri })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                resultDiv.innerHTML =
                    '<span class="text-success"><i class="bi bi-check-circle me-1"></i>' + data.message + '</span>';
                nextBtn.disabled = false;
            } else {
                resultDiv.innerHTML =
                    '<span class="text-danger"><i class="bi bi-x-circle me-1"></i>' + data.message + '</span>';
                nextBtn.disabled = true;
            }
        })
        .catch(() => {
            resultDiv.innerHTML =
                '<span class="text-danger"><i class="bi bi-x-circle me-1"></i>' + i18n.errorUnexpected + '</span>';
            nextBtn.disabled = true;
        })
        .finally(() => {
            checkBtn.disabled = false;
        });
    }
</script>
</body>
</html>
