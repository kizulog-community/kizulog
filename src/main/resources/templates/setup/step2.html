<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KizuLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .setup-card { max-width: 640px; margin: 60px auto; }
        .step { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.875rem; }
        .step.done { background-color: #198754; color: white; }
        .step.active { background-color: #0d6efd; color: white; }
        .step.todo { background-color: #dee2e6; color: #6c757d; }
        .step-line { flex: 1; height: 2px; background-color: #dee2e6; margin: 0 8px; }
    </style>
</head>
<body>
<div class="setup-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i><span th:text="#{setup.title}"></span>
        </h1>
        <p class="text-muted mb-0" th:text="#{setup.subtitle}"></p>
    </div>

    <div class="d-flex align-items-center justify-content-center mb-4">
        <div class="step done"><i class="bi bi-check"></i></div>
        <div class="step-line"></div>
        <div class="step active">2</div>
        <div class="step-line"></div>
        <div class="step todo">3</div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-1" th:text="#{setup.step2.title}"></h5>
            <p class="text-muted small mb-4" th:text="#{setup.step2.description}"></p>

            <form th:action="@{/setup/step2}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-translate me-1"></i>
                        <span th:text="#{setup.step2.label.defaultLanguage}"></span>
                    </label>
                    <select name="defaultLanguage" class="form-select">
                        <option th:each="lang : ${languages}"
                                th:value="${lang.name()}"
                                th:text="${lang.displayName}"
                                th:selected="${lang == sessionData.defaultLanguage}">
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-check2-square me-1"></i>
                        <span th:text="#{setup.step2.label.availableLanguages}"></span>
                    </label>
                    <div class="border rounded p-3 bg-light">
                        <div th:each="lang : ${languages}" class="form-check">
                            <input type="checkbox" class="form-check-input"
                                   name="availableLanguages"
                                   th:value="${lang.name()}"
                                   th:id="${'lang-' + lang.name()}"
                                   th:checked="${sessionData.availableLanguages.contains(lang)}"/>
                            <label class="form-check-label"
                                   th:for="${'lang-' + lang.name()}"
                                   th:text="${lang.displayName}"></label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-clock me-1"></i>
                        <span th:text="#{setup.step2.label.defaultTimezone}"></span>
                    </label>
                    <select name="defaultTimezone" class="form-select">
                        <option th:each="tz : ${timezones}"
                                th:value="${tz.name()}"
                                th:text="${tz.displayName}"
                                th:selected="${tz == sessionData.defaultTimezone}">
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-check2-square me-1"></i>
                        <span th:text="#{setup.step2.label.availableTimezones}"></span>
                    </label>
                    <div class="border rounded p-3 bg-light">
                        <div th:each="tz : ${timezones}" class="form-check">
                            <input type="checkbox" class="form-check-input"
                                   name="availableTimezones"
                                   th:value="${tz.name()}"
                                   th:id="${'tz-' + tz.name()}"
                                   th:checked="${sessionData.availableTimezones.contains(tz)}"/>
                            <label class="form-check-label"
                                   th:for="${'tz-' + tz.name()}"
                                   th:text="${tz.displayName}"></label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/setup/step1" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i>
                        <span th:text="#{setup.button.back}"></span>
                    </a>
                    <button type="submit" class="btn btn-primary px-4">
                        <span th:text="#{setup.button.next}"></span>
                        <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
