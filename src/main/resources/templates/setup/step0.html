<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KizuLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .setup-card { max-width: 480px; margin: 60px auto; }
        .lang-option input[type="radio"] { display: none; }
        .lang-option label {
            display: block;
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-option input[type="radio"]:checked + label {
            border-color: #0d6efd;
            background-color: #f0f4ff;
        }
    </style>
</head>
<body>
<div class="setup-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i>KizuLog
        </h1>
        <p class="text-muted mb-0">Initial Setup / 初期セットアップ</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-1">
                <i class="bi bi-translate me-2"></i>Language / 言語
            </h5>
            <p class="text-muted small mb-4">
                Select the language to use.<br>
                使用する言語を選択してください。
            </p>

            <form th:action="@{/setup/step0}" method="post">
                <div class="d-flex flex-column gap-2 mb-4">
                    <div th:each="lang : ${languages}" class="lang-option">
                        <input type="radio"
                               name="language"
                               th:id="${'lang-' + lang.name()}"
                               th:value="${lang.name()}"
                               th:checked="${lang == sessionData.setupLanguage}"/>
                        <label th:for="${'lang-' + lang.name()}">
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-globe2 text-primary"></i>
                                <span th:text="${lang.displayName}" class="fw-semibold"></span>
                            </div>
                        </label>
                    </div>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4">
                        Next / 次へ <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
