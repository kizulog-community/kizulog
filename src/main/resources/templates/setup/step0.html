<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KizuLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .setup-card { max-width: 480px; margin: 60px auto; }
        .lang-option input[type="radio"] { display: none; }
        .lang-option label {
            display: block;
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-option input[type="radio"]:checked + label {
            border-color: #0d6efd;
            background-color: #f0f4ff;
        }
        .lang-option.is-invalid label {
            border-color: #dc3545;
        }
    </style>
</head>
<body>
<div class="setup-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i>KizuLog
        </h1>
        <p class="text-muted mb-0">Initial Setup / 初期セットアップ</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-1">
                <i class="bi bi-translate me-2"></i>Language / 言語
            </h5>
            <p class="text-muted small mb-4">
                Select the language to use.<br>
                使用する言語を選択してください。
            </p>

            <form th:action="@{/setup/step0}"
                  th:object="${step0FormData}"
                  method="post" novalidate>
                <div class="d-flex flex-column gap-2 mb-2"
                     th:classappend="${#fields.hasErrors('language')} ? 'is-invalid' : ''">
                    <div th:each="lang, iter : ${languages}" class="lang-option"
                         th:classappend="${#fields.hasErrors('language')} ? 'is-invalid' : ''">
                        <input type="radio"
                               th:field="*{language}"
                               th:id="${'lang-' + lang.name()}"
                               th:value="${lang.name()}"
                               class="lang-radio"
                               required/>
                        <label th:for="${'lang-' + lang.name()}">
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-globe2 text-primary"></i>
                                <span th:text="${lang.displayName}" class="fw-semibold"></span>
                            </div>
                        </label>
                    </div>
                </div>
                <div class="text-danger small mb-3"
                     th:if="${#fields.hasErrors('language')}"
                     th:errors="*{language}">エラーメッセージ</div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4" id="nextBtn" disabled>
                        Next / 次へ <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function() {
    const nextBtn = document.getElementById('nextBtn');
    const radios = document.querySelectorAll('.lang-radio');

    function updateNextButton() {
        const anyChecked = Array.from(radios).some(r => r.checked);
        nextBtn.disabled = !anyChecked;
    }

    // 初期表示時の状態判定（セッション復元で既に選択済みの場合はenabled）
    updateNextButton();

    // ラジオ変更時に再評価
    radios.forEach(r => r.addEventListener('change', updateNextButton));
})();
</script>
</body>
</html>
