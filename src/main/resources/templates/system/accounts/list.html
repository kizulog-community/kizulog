<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{system/fragments/layout :: head(title=#{system.accounts.list.title})}">
</head>
<body>

<header th:replace="~{system/fragments/layout :: header}"></header>

<div class="container-fluid">
    <div class="row">
        <aside th:replace="~{system/fragments/layout :: sidebar(activeMenu='accounts')}"></aside>

        <main class="col-md-9 col-lg-10 system-content">
            <!-- パンくず -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/system/accounts}"
                           th:text="#{system.menu.accounts}">アカウント管理</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:text="#{system.accounts.list.breadcrumb}">アカウント一覧</li>
                </ol>
            </nav>

            <!-- ヘッダー -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3 mb-0">
                    <i class="bi bi-person-lines-fill me-2"></i>
                    <span th:text="#{system.accounts.list.title}">アカウント一覧</span>
                </h1>
            </div>

            <!-- 一覧外フラッシュメッセージ -->
            <div th:if="${flashErrorKey}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <span th:text="#{__${flashErrorKey}__}">エラー</span>
            </div>

            <!-- 説明 -->
            <p class="text-muted small mb-3" th:text="#{system.accounts.list.description}">
                登録済みシステム管理者アカウントの一覧です。
            </p>

            <!-- テーブル -->
            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{system.accounts.list.column.account}">アカウント</th>
                            <th th:text="#{system.accounts.list.column.status}">ステータス</th>
                            <th th:text="#{system.accounts.list.column.role}">ロール</th>
                            <th th:text="#{system.accounts.list.column.identities}">identity数</th>
                            <th th:text="#{system.accounts.list.column.createdAt}">作成日時</th>
                            <th class="text-end" th:text="#{system.accounts.list.column.actions}">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${items}">
                            <!-- ============================================================ -->
                            <!-- T.0: 名前を主表示、UUIDを小さくグレー                          -->
                            <!-- claimsPerAccount から familyName/givenName/organization/email  -->
                            <!-- を取得して表示                                                  -->
                            <!-- ============================================================ -->
                            <td>
                                <th:block th:with="
                                    claims=${claimsPerAccount.get(item.accountId)},
                                    familyName=${claims != null ? claims.get('familyName') : null},
                                    givenName=${claims != null ? claims.get('givenName') : null},
                                    middleName=${claims != null ? claims.get('middleName') : null},
                                    organization=${claims != null ? claims.get('organization') : null},
                                    email=${claims != null ? claims.get('email') : null},
                                    hasName=${familyName != null or givenName != null or middleName != null}">

                                    <!-- 名前部分（姓 名 ミドルネーム） -->
                                    <div class="fw-semibold">
                                        <th:block th:if="${hasName}">
                                            <span th:if="${familyName != null}" th:text="${familyName}">山田</span>
                                            <th:block th:if="${familyName != null and givenName != null}"> </th:block>
                                            <span th:if="${givenName != null}" th:text="${givenName}">太郎</span>
                                            <span th:if="${middleName != null}" class="ms-1" th:text="${middleName}">M.</span>
                                        </th:block>
                                        <!-- 名前なし→emailにフォールバック -->
                                        <span th:if="${!hasName and email != null}" th:text="${email}">user@example.com</span>
                                        <!-- emailもなし -->
                                        <span th:if="${!hasName and email == null}"
                                              class="text-muted fst-italic"
                                              th:text="#{system.accounts.list.namelessFallback}">
                                            （名前情報なし）
                                        </span>

                                        <!-- 自分バッジ -->
                                        <span th:if="${item.self}" class="badge text-bg-info ms-2 small"
                                              th:text="#{system.accounts.list.selfBadge}">自分</span>
                                    </div>

                                    <!-- 所属 -->
                                    <div th:if="${organization != null}" class="text-muted small">
                                        <i class="bi bi-building me-1"></i>
                                        <span th:text="${organization}">開発部</span>
                                    </div>

                                    <!-- メール（名前部分でfallbackとして使っていない場合のみ） -->
                                    <div th:if="${hasName and email != null}" class="text-muted small">
                                        <i class="bi bi-envelope me-1"></i>
                                        <span th:text="${email}">user@example.com</span>
                                    </div>

                                    <!-- UUID -->
                                    <div class="text-muted small font-monospace"
                                         style="font-size: 0.75rem;"
                                         th:text="${item.accountId}">acc-uuid</div>
                                </th:block>
                            </td>
                            <td>
                                <span th:if="${item.currentStatus.name() == 'ACTIVE'}"
                                      class="badge text-bg-success"
                                      th:text="#{system.accounts.status.ACTIVE}">有効</span>
                                <span th:if="${item.currentStatus.name() == 'INACTIVE'}"
                                      class="badge text-bg-secondary"
                                      th:text="#{system.accounts.status.INACTIVE}">無効</span>
                                <span th:if="${item.currentStatus.name() == 'SUSPENDED'}"
                                      class="badge text-bg-warning"
                                      th:text="#{system.accounts.status.SUSPENDED}">一時停止</span>
                            </td>
                            <td>
                                <span th:if="${item.systemAdminRoleActive}"
                                      class="badge text-bg-primary"
                                      th:text="#{system.accounts.list.role.systemAdminActive}">SYSTEM_ADMIN</span>
                                <span th:if="${!item.systemAdminRoleActive}"
                                      class="badge text-bg-light text-dark"
                                      th:text="#{system.accounts.list.role.none}">なし</span>
                            </td>
                            <td>
                                <span th:text="${item.activeIdentityCount}">1</span>
                            </td>
                            <td>
                                <span class="small"
                                      th:text="${@dateTimeFormatHelper.formatDateTimeShort(item.createdAt)}">
                                    2026-05-14 18:00
                                </span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{'/system/accounts/' + ${item.accountId}}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i>
                                    <span th:text="#{system.accounts.list.action.detail}">詳細</span>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(items)}">
                            <td colspan="6" class="text-center text-muted py-4"
                                th:text="#{system.accounts.list.empty}">
                                該当するアカウントはありません。
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- 共通フッタ -->
<footer th:replace="~{system/fragments/layout :: footer}"></footer>

<script th:replace="~{system/fragments/layout :: scripts}"></script>
</body>
</html>
