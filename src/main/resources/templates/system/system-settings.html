<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{system/fragments/layout :: head(title=#{system.systemSettings.title})}">
    <!-- layout.htmlの::headで置き換えられる -->
</head>
<body>

    <nav th:replace="~{system/fragments/layout :: header}"></nav>

    <div class="container-fluid">
        <div class="row">

            <aside th:replace="~{system/fragments/layout :: sidebar(activeMenu='system-settings')}"></aside>

            <main class="col-md-9 col-lg-10 system-content">

                <!-- ページタイトル -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">
                        <i class="bi bi-gear me-2"></i>
                        <span th:text="#{system.systemSettings.title}">システム管理</span>
                    </h1>
                </div>

                <p class="text-muted mb-4" th:text="#{system.systemSettings.description}">
                    KizuLog システム全体の設定を管理します。
                </p>

                <!-- 設定カードリスト -->
                <div class="row g-3">

                    <!-- OIDC プロバイダー（実装済） -->
                    <div class="col-md-6 col-lg-4">
                        <a th:href="@{/system/system-settings/oidc-providers}"
                           class="card h-100 text-decoration-none text-body settings-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="settings-icon-wrapper bg-primary bg-opacity-10 text-primary me-3">
                                        <i class="bi bi-shield-lock"></i>
                                    </div>
                                    <h5 class="card-title mb-0"
                                        th:text="#{system.systemSettings.cards.oidcProviders.title}">
                                        OIDC プロバイダー
                                    </h5>
                                </div>
                                <p class="card-text text-muted small mb-0"
                                   th:text="#{system.systemSettings.cards.oidcProviders.description}">
                                    システム管理者がログインに使用する OIDC プロバイダーを管理します。
                                </p>
                            </div>
                        </a>
                    </div>

                    <!-- 言語・タイムゾーン（J.0で実装済） -->
                    <div class="col-md-6 col-lg-4">
                        <a th:href="@{/system/system-settings/localization}"
                           class="card h-100 text-decoration-none text-body settings-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="settings-icon-wrapper bg-info bg-opacity-10 text-info me-3">
                                        <i class="bi bi-translate"></i>
                                    </div>
                                    <h5 class="card-title mb-0"
                                        th:text="#{system.systemSettings.cards.localization.title}">
                                        言語・タイムゾーン
                                    </h5>
                                </div>
                                <p class="card-text text-muted small mb-0"
                                   th:text="#{system.systemSettings.cards.localization.description}">
                                    システム全体の既定言語とタイムゾーンを管理します。
                                </p>
                            </div>
                        </a>
                    </div>

                </div>

            </main>

        </div>
    </div>

    <!-- ページ固有のスタイル -->
    <style>
        .settings-card {
            border: 1px solid #dee2e6;
            transition: all 0.2s ease;
        }
        .settings-card:hover {
            border-color: #0d6efd;
            box-shadow: 0 0.25rem 0.5rem rgba(13, 110, 253, 0.1);
            transform: translateY(-2px);
        }
        .settings-card-disabled {
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
            cursor: not-allowed;
        }
        .settings-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
    </style>

    <th:block th:replace="~{system/fragments/layout :: scripts}"></th:block>

</body>
</html>
