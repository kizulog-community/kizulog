<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{system/fragments/layout :: head(title=#{system.my-profile.title})}">
    <!-- layout.htmlの::headで置き換えられる -->
</head>
<body>

    <nav th:replace="~{system/fragments/layout :: header}"></nav>

    <div class="container-fluid">
        <div class="row">

            <aside th:replace="~{system/fragments/layout :: sidebar(activeMenu='my-profile')}"></aside>

            <main class="col-md-9 col-lg-10 system-content">

                <!-- ページタイトル -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">
                        <i class="bi bi-person-gear me-2"></i>
                        <span th:text="#{system.my-profile.title}">プロフィール設定</span>
                    </h1>
                </div>

                <p class="text-muted mb-4" th:text="#{system.my-profile.description}">
                    あなた自身の利用設定を管理します。
                </p>

                <!-- ============================================================ -->
                <!-- T.0仕様変更: あなたの情報セクション                          -->
                <!-- ============================================================ -->
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="#{system.my-profile.section.myInfo}">あなたの情報</span>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <!-- 左カラム: プロフィール（クレーム情報） -->
                            <div class="col-md-6">
                                <h6 class="text-muted small fw-semibold mb-2">
                                    <i class="bi bi-person-vcard me-1"></i>
                                    <span th:text="#{system.my-profile.section.myInfo.profile}">プロフィール</span>
                                </h6>

                                <!-- クレーム情報が空の場合 -->
                                <p th:if="${#lists.isEmpty(myClaimsDisplay)}"
                                   class="text-muted small mb-0">
                                    <i class="bi bi-dash-circle me-1"></i>
                                    <span th:text="#{system.my-profile.section.myInfo.claims.empty}">
                                        取得できたプロフィール情報はありません
                                    </span>
                                </p>

                                <!-- クレーム情報がある場合 -->
                                <dl th:unless="${#lists.isEmpty(myClaimsDisplay)}"
                                    class="row mb-0 small">
                                    <th:block th:each="entry : ${myClaimsDisplay}">
                                        <dt class="col-sm-4 text-muted"
                                            th:text="${entry.label}">姓</dt>
                                        <dd class="col-sm-8 mb-2"
                                            th:text="${entry.value}">山田</dd>
                                    </th:block>
                                </dl>
                            </div>

                            <!-- 右カラム: ログイン中Identity 接続情報 -->
                            <div class="col-md-6">
                                <h6 class="text-muted small fw-semibold mb-2">
                                    <i class="bi bi-key me-1"></i>
                                    <span th:text="#{system.my-profile.section.myInfo.connection}">ログイン中Identity</span>
                                </h6>
                                <dl class="row mb-0 small">
                                    <dt class="col-sm-4 text-muted"
                                        th:text="#{system.my-profile.section.myInfo.iss}">Issuer</dt>
                                    <dd class="col-sm-8 mb-2">
                                        <code class="text-break"
                                              th:text="${myIss != null ? myIss : '-'}">https://auth/realm</code>
                                    </dd>

                                    <dt class="col-sm-4 text-muted"
                                        th:text="#{system.my-profile.section.myInfo.aud}">Audience</dt>
                                    <dd class="col-sm-8 mb-2">
                                        <code th:text="${myAud != null ? myAud : '-'}">client-id</code>
                                    </dd>

                                    <dt class="col-sm-4 text-muted"
                                        th:text="#{system.my-profile.section.myInfo.sub}">Subject</dt>
                                    <dd class="col-sm-8 mb-0">
                                        <code class="text-break"
                                              th:text="${mySub != null ? mySub : '-'}">user-uuid</code>
                                    </dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 設定カードリスト -->
                <div class="row g-3">

                    <!-- 言語・タイムゾーン -->
                    <div class="col-md-6 col-lg-4">
                        <a th:href="@{/system/my-profile/localization}"
                           class="card h-100 text-decoration-none text-body myprofile-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="myprofile-icon-wrapper bg-info bg-opacity-10 text-info me-3">
                                        <i class="bi bi-translate"></i>
                                    </div>
                                    <h5 class="card-title mb-0"
                                        th:text="#{system.my-profile.cards.localization.title}">
                                        言語・タイムゾーン
                                    </h5>
                                </div>
                                <p class="card-text text-muted small mb-0"
                                   th:text="#{system.my-profile.cards.localization.description}">
                                    画面表示で使用する言語とタイムゾーンを設定します。
                                </p>
                            </div>
                        </a>
                    </div>

                    <!-- 連携OIDCプロバイダー -->
                    <div class="col-md-6 col-lg-4">
                        <a th:href="@{/system/my-profile/oidc-links}"
                           class="card h-100 text-decoration-none text-body myprofile-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="myprofile-icon-wrapper bg-primary bg-opacity-10 text-primary me-3">
                                        <i class="bi bi-link-45deg"></i>
                                    </div>
                                    <h5 class="card-title mb-0"
                                        th:text="#{system.my-profile.cards.oidcLinks.title}">
                                        連携OIDCプロバイダー
                                    </h5>
                                </div>
                                <p class="card-text text-muted small mb-0"
                                   th:text="#{system.my-profile.cards.oidcLinks.description}">
                                    あなたのアカウントに紐付くOIDCプロバイダーを管理します。
                                </p>
                            </div>
                        </a>
                    </div>

                </div>

            </main>

        </div>
    </div>

    <style>
        .myprofile-card {
            border: 1px solid #dee2e6;
            transition: all 0.2s ease;
        }
        .myprofile-card:hover {
            border-color: #0d6efd;
            box-shadow: 0 0.25rem 0.5rem rgba(13, 110, 253, 0.1);
            transform: translateY(-2px);
        }
        .myprofile-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
    </style>

    <!-- 共通フッタ -->
    <footer th:replace="~{system/fragments/layout :: footer}"></footer>

    <th:block th:replace="~{system/fragments/layout :: scripts}"></th:block>

</body>
</html>
