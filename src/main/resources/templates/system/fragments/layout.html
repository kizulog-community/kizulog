<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<!-- ============================================================ -->
<!-- head フラグメント: 共通CSS/meta                              -->
<!-- 呼び出し側で <head th:replace="~{system/fragments/layout :: head(title='...')}"> -->
<!-- ============================================================ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <title th:text="${title}">KizuLog</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />

    <!-- Bootstrap Icons (CDN) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- 共通スタイル（セットアップウィザードのカラーリングに統一） -->
    <style>
        body {
            font-size: 0.95rem;
            background-color: #f8f9fa; /* セットアップウィザードと統一 */
        }

        /* ヘッダ（ナビゲーションバー）: Primary（青）基調 */
        .navbar-brand {
            font-weight: 600;
        }
        .navbar-brand i {
            font-size: 1.25rem;
        }

        /* サイドバー */
        .system-sidebar {
            min-height: calc(100vh - 56px);
            background-color: #ffffff; /* 白背景でカード風 */
            border-right: 1px solid #dee2e6;
        }
        .system-sidebar .nav-link {
            color: #495057;
            padding: 0.75rem 1rem;
            border-radius: 0;
            transition: all 0.2s;
        }
        .system-sidebar .nav-link:hover {
            background-color: #f0f4ff; /* セットアップの選択時背景と統一 */
            color: #0d6efd;
        }
        .system-sidebar .nav-link.active {
            background-color: #0d6efd; /* primary */
            color: #ffffff;
            font-weight: 500;
        }
        .system-sidebar .nav-link i {
            margin-right: 0.5rem;
        }
        /* サイドバー内のセクション区切り */
        .system-sidebar .sidebar-divider {
            border-top: 1px solid #dee2e6;
            margin: 0.5rem 0;
        }

        /* メインコンテンツエリア */
        .system-content {
            padding: 1.5rem;
        }

        /* カード（セットアップと同じシャドウ感） */
        .card {
            border: 1px solid #dee2e6;
        }
    </style>
</head>

<body>

<!-- ============================================================ -->
<!-- header フラグメント: ヘッダ                                  -->
<!-- 呼び出し側で <header th:replace="~{system/fragments/layout :: header}"> -->
<!-- ============================================================ -->
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/system/dashboard}">
            <i class="bi bi-shield-lock-fill me-2"></i>
            <span th:text="#{system.layout.brand}">KizuLog</span>
        </a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3 small">
                <i class="bi bi-person-circle"></i>
                <span th:text="#{system.layout.loggedInLabel}">ログイン中: </span>
                <span th:text="#{system.layout.loggedInUserDefault}">システム管理者</span>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    <span th:text="#{system.layout.logoutButton}">ログアウト</span>
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- ============================================================ -->
<!-- sidebar フラグメント: サイドバー                              -->
<!-- 呼び出し側で <aside th:replace="~{system/fragments/layout :: sidebar(activeMenu='dashboard')}"> -->
<!-- ============================================================ -->
<aside th:fragment="sidebar(activeMenu)" class="col-md-3 col-lg-2 system-sidebar p-0">
    <nav class="nav flex-column py-3">
        <a class="nav-link"
           th:href="@{/system/dashboard}"
           th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
            <i class="bi bi-speedometer2"></i>
            <span th:text="#{system.menu.dashboard}">ダッシュボード</span>
        </a>
        <a class="nav-link"
           th:href="@{/system/tenants}"
           th:classappend="${activeMenu == 'tenants'} ? 'active' : ''">
            <i class="bi bi-buildings"></i>
            <span th:text="#{system.menu.tenants}">テナント管理</span>
        </a>
        <a class="nav-link"
           th:href="@{/system/system-settings}"
           th:classappend="${activeMenu == 'system-settings'} ? 'active' : ''">
            <i class="bi bi-gear"></i>
            <span th:text="#{system.menu.systemSettings}">システム管理</span>
        </a>
        <a class="nav-link"
           th:href="@{/system/accounts}"
           th:classappend="${activeMenu == 'accounts'} ? 'active' : ''">
            <i class="bi bi-people"></i>
            <span th:text="#{system.menu.accounts}">アカウント管理</span>
        </a>

        <!-- 個人設定セクション区切り -->
        <div class="sidebar-divider"></div>

        <a class="nav-link"
           th:href="@{/system/my-profile}"
           th:classappend="${activeMenu == 'my-profile'} ? 'active' : ''">
            <i class="bi bi-person-gear"></i>
            <span th:text="#{system.menu.myProfile}">プロフィール設定</span>
        </a>
    </nav>
</aside>

<!-- ============================================================ -->
<!-- scripts フラグメント: 共通JS                                  -->
<!-- 呼び出し側で <script th:replace="~{system/fragments/layout :: scripts}"> -->
<!-- ============================================================ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</th:block>

</body>
</html>
