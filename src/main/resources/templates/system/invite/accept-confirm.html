<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="#{system.invite.accept.title}">KizuLog System Administrator Invitation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body { background-color: #f8f9fa; }
        .invite-card { max-width: 480px; margin: 60px auto; }
        .btn-provider { padding: 0.65rem 0; font-weight: 500; }
        .display-name-box {
            background-color: #f0f4ff;
            border: 1px solid #cfe2ff;
            border-radius: 0.375rem;
            padding: 0.75rem 1rem;
        }
    </style>
</head>
<body>

<div class="invite-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i>KizuLog
        </h1>
        <p class="text-muted mb-0" th:text="#{system.invite.accept.subtitle}">
            System Administrator Invitation
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-3 text-center">
                <i class="bi bi-envelope-paper me-2"></i>
                <span th:text="#{system.invite.accept.heading}">招待を受諾</span>
            </h5>

            <!-- 招待先表示名のハイライト -->
            <div class="display-name-box mb-3">
                <div class="small text-muted mb-1"
                     th:text="#{system.invite.accept.invitedAs}">
                    あなたは以下として招待されています
                </div>
                <div class="fw-bold" th:text="${displayName}">表示名</div>
            </div>

            <p class="text-muted small mb-4" th:text="#{system.invite.accept.description}">
                以下のプロバイダーからログインして、システム管理者として登録を完了してください。
            </p>

            <!-- プロバイダー選択ボタン -->
            <div th:if="${not #lists.isEmpty(providers)}" class="d-grid gap-2">
                <a th:each="p : ${providers}"
                   th:href="@{'/oauth2/authorization/' + ${p.providerId}}"
                   class="btn btn-primary btn-provider">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    <span th:text="${p.displayName}">Provider Name</span>
                </a>
            </div>

            <!-- プロバイダー0件時の異常表示 -->
            <div th:if="${#lists.isEmpty(providers)}" class="alert alert-warning small mb-0" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <span th:text="#{system.invite.accept.noProviderAvailable}">
                    現在利用可能なOIDCプロバイダーがありません。発行者に連絡してください。
                </span>
            </div>
        </div>
    </div>

    <p class="text-center text-muted small mt-4 mb-0">
        <i class="bi bi-info-circle me-1"></i>
        <span th:text="#{system.invite.accept.footer}">
            この招待は有効期限内にのみ受諾できます。
        </span>
    </p>
</div>

<!-- 共通フッタ（S.0シリーズで追加） -->
<footer th:replace="~{common/fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
