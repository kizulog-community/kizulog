<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{system/fragments/layout :: head(title=#{system.accounts.title})}">
    <!-- layout.htmlの::headで置き換えられる -->
</head>
<body>

    <nav th:replace="~{system/fragments/layout :: header}"></nav>

    <div class="container-fluid">
        <div class="row">

            <aside th:replace="~{system/fragments/layout :: sidebar(activeMenu='accounts')}"></aside>

            <main class="col-md-9 col-lg-10 system-content">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">
                        <i class="bi bi-people me-2"></i>
                        <span th:text="#{system.accounts.title}">アカウント管理</span>
                    </h1>
                </div>

                <p class="text-muted small mb-4" th:text="#{system.accounts.description}">
                    システム管理者アカウントの管理を行います。
                </p>

                <div class="row g-3">
                    <!-- 招待管理カード(I.0で追加) -->
                    <div class="col-md-6 col-lg-4">
                        <a th:href="@{/system/accounts/invitations}"
                           class="card text-decoration-none text-reset h-100 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-envelope-paper text-primary me-2"
                                       style="font-size: 1.5rem;"></i>
                                    <h5 class="card-title mb-0"
                                        th:text="#{system.accounts.feature.invitations.title}">
                                        招待管理
                                    </h5>
                                </div>
                                <p class="card-text small text-muted mb-0"
                                   th:text="#{system.accounts.feature.invitations.description}">
                                    新規システム管理者の招待リンクを発行・管理します。
                                </p>
                            </div>
                        </a>
                    </div>

                    <!-- アカウント一覧カード(Coming Soon) -->
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm opacity-50">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-person-lines-fill text-secondary me-2"
                                       style="font-size: 1.5rem;"></i>
                                    <h5 class="card-title mb-0"
                                        th:text="#{system.accounts.feature.list.title}">
                                        アカウント一覧
                                    </h5>
                                    <span class="badge text-bg-secondary ms-2 small"
                                          th:text="#{system.common.comingSoon.badge}">Coming Soon</span>
                                </div>
                                <p class="card-text small text-muted mb-0"
                                   th:text="#{system.accounts.feature.list.description}">
                                    登録済みシステム管理者の一覧を表示します。
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <th:block th:replace="~{system/fragments/layout :: scripts}"></th:block>

</body>
</html>
