<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{system/fragments/layout :: head(title=#{system.accounts.title})}">
    <!-- layout.htmlの::headで置き換えられる -->
</head>
<body>

    <nav th:replace="~{system/fragments/layout :: header}"></nav>

    <div class="container-fluid">
        <div class="row">

            <aside th:replace="~{system/fragments/layout :: sidebar(activeMenu='accounts')}"></aside>

            <main class="col-md-9 col-lg-10 system-content">

                <!-- ページタイトル -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">
                        <i class="bi bi-people me-2"></i>
                        <span th:text="#{system.accounts.title}">アカウント管理</span>
                    </h1>
                </div>

                <p class="text-muted mb-4" th:text="#{system.accounts.description}">
                    システム管理者アカウントの管理を行います。
                </p>

                <!-- 機能カードリスト -->
                <div class="row g-3">

                    <!-- 招待管理(I.0) -->
                    <div class="col-md-6 col-lg-4">
                        <a th:href="@{/system/accounts/invitations}"
                           class="card h-100 text-decoration-none text-body accounts-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="accounts-icon-wrapper bg-primary bg-opacity-10 text-primary me-3">
                                        <i class="bi bi-envelope-paper"></i>
                                    </div>
                                    <h5 class="card-title mb-0"
                                        th:text="#{system.accounts.feature.invitations.title}">
                                        招待管理
                                    </h5>
                                </div>
                                <p class="card-text text-muted small mb-0"
                                   th:text="#{system.accounts.feature.invitations.description}">
                                    新規システム管理者の招待リンクを発行・管理します。
                                </p>
                            </div>
                        </a>
                    </div>

                    <!-- アカウント一覧(N.0) -->
                    <div class="col-md-6 col-lg-4">
                        <a th:href="@{/system/accounts/list}"
                           class="card h-100 text-decoration-none text-body accounts-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="accounts-icon-wrapper bg-info bg-opacity-10 text-info me-3">
                                        <i class="bi bi-person-lines-fill"></i>
                                    </div>
                                    <h5 class="card-title mb-0"
                                        th:text="#{system.accounts.feature.list.title}">
                                        アカウント一覧
                                    </h5>
                                </div>
                                <p class="card-text text-muted small mb-0"
                                   th:text="#{system.accounts.feature.list.description}">
                                    登録済みシステム管理者の一覧を表示します。
                                </p>
                            </div>
                        </a>
                    </div>

                </div>

            </main>

        </div>
    </div>

    <!-- ページ固有のスタイル（my-profile / system-settings と同じパターン） -->
    <style>
        .accounts-card {
            border: 1px solid #dee2e6;
            transition: all 0.2s ease;
        }
        .accounts-card:hover {
            border-color: #0d6efd;
            box-shadow: 0 0.25rem 0.5rem rgba(13, 110, 253, 0.1);
            transform: translateY(-2px);
        }
        .accounts-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
    </style>

    <!-- 共通フッタ（S.0シリーズで追加） -->
    <footer th:replace="~{system/fragments/layout :: footer}"></footer>

    <th:block th:replace="~{system/fragments/layout :: scripts}"></th:block>

</body>
</html>
