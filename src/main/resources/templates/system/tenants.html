<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{system/fragments/layout :: head(title=#{system.tenants.title})}">
    <!-- layout.htmlの::headで置き換えられる -->
</head>
<body>

    <nav th:replace="~{system/fragments/layout :: header}"></nav>

    <div class="container-fluid">
        <div class="row">

            <aside th:replace="~{system/fragments/layout :: sidebar(activeMenu='tenants')}"></aside>

            <main class="col-md-9 col-lg-10 system-content">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">
                        <i class="bi bi-buildings me-2"></i>
                        <span th:text="#{system.tenants.title}">テナント管理</span>
                    </h1>
                </div>

                <div class="card">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-tools text-primary" style="font-size: 3rem;"></i>
                        <h5 class="mt-3" th:text="#{system.common.comingSoon.title}">Coming Soon</h5>
                        <p class="text-muted mb-0" th:text="#{system.tenants.comingSoon.description}">
                            テナント管理機能は現在実装中です。
                        </p>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <th:block th:replace="~{system/fragments/layout :: scripts}"></th:block>

</body>
</html>
