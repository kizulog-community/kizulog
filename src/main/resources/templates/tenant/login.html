<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${tenant.name} + ' - ' + #{tenant.login.subtitle}">テナントログイン</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body { background-color: #f8f9fa; }
        .login-container { max-width: 480px; margin: 60px auto; }
        .login-card { background: white; border-radius: 8px; padding: 32px;
                      box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .tenant-name { font-size: 1.5rem; font-weight: 600; }
        .tenant-subtitle { font-size: 0.875rem; color: #6c757d; }
        .provider-btn { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-card">

                <!-- ヘッダー -->
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock" style="font-size: 2.5rem; color: #0d6efd;"></i>
                    <div class="tenant-name mt-2" th:text="${tenant.name}">テナント名</div>
                    <div class="tenant-subtitle" th:text="#{tenant.login.subtitle}">
                        KizuLog 勤怠管理システム
                    </div>
                </div>

                <h1 class="h4 mb-3 text-center"
                    th:text="#{tenant.login.heading}">ログイン</h1>

                <!-- ENABLED プロバイダーが1個以上ある場合 -->
                <div th:if="${not #lists.isEmpty(enabledProviders)}">
                    <p class="text-muted small mb-3"
                       th:text="#{tenant.login.description}">
                        お使いの認証プロバイダーでログインしてください。
                    </p>

                    <!-- プロバイダーボタン -->
                    <div th:each="provider : ${enabledProviders}">
                        <button type="button"
                                class="btn btn-primary w-100 provider-btn"
                                th:disabled="${!authFlowImplemented}"
                                th:title="${!authFlowImplemented}
                                    ? #{tenant.login.notice.authNotImplemented}
                                    : null">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            <span th:text="${provider.displayName}">プロバイダー名</span>
                        </button>
                    </div>

                    <!-- 認証フロー未実装の注意書き -->
                    <div th:if="${!authFlowImplemented}"
                         class="alert alert-warning small mt-3 mb-0" role="alert">
                        <i class="bi bi-exclamation-triangle me-1"></i>
                        <span th:text="#{tenant.login.notice.authNotImplemented}">
                            認証機能は準備中です。
                        </span>
                    </div>
                </div>

                <!-- ENABLED プロバイダーが0件の場合（設計L1） -->
                <div th:if="${#lists.isEmpty(enabledProviders)}"
                     class="alert alert-info text-center" role="alert">
                    <i class="bi bi-info-circle d-block mb-2" style="font-size: 2rem;"></i>
                    <p class="mb-0" th:utext="#{tenant.login.notice.noProviders}">
                        OIDC プロバイダーが未設定です。<br/>
                        システム管理者にお問い合わせください。
                    </p>
                </div>

                <!-- フッター: テナント情報（デバッグ用、後で削除予定） -->
                <hr class="my-4" />
                <div class="small text-muted">
                    <div>
                        <span th:text="#{tenant.login.debug.slug}">slug:</span>
                        <code th:text="${slug}">slug</code>
                    </div>
                    <div>
                        <span th:text="#{tenant.login.debug.tenantName}">tenant name:</span>
                        <span th:text="${tenant.name}">テナント名</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
