<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{tenant/fragments/layout :: head(title=#{tenant.dashboard.title})}">
    <!-- layout.html の ::head で置き換えられる -->
</head>
<body>

<!-- ヘッダ（ユーザ表示名ドロップダウン + プロフィール設定 + ログアウト） -->
<nav th:replace="~{tenant/fragments/layout :: header}"></nav>

<div class="container py-4" style="max-width: 900px;">

    <!-- ============================================================ -->
    <!-- flash メッセージ（打刻結果）                                  -->
    <!-- ============================================================ -->
    <div th:if="${flashSuccessKey != null}"
         class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="#{__${flashSuccessKey}__}">成功しました</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${flashErrorKey != null}"
         class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="#{__${flashErrorKey}__}">エラーが発生しました</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- ============================================================ -->
    <!-- ページヘッダ                                                  -->
    <!-- ============================================================ -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            <i class="bi bi-speedometer2 me-2"></i>
            <span th:text="#{tenant.dashboard.title}">ダッシュボード</span>
        </h1>
    </div>

    <!-- ============================================================ -->
    <!-- 打刻パネル                                                    -->
    <!-- ============================================================ -->
    <div class="card mb-4" th:if="${attendancePanel != null}">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-clock-history me-2 text-primary"></i>
                <span th:text="#{tenant.attendance.panel.heading}">打刻</span>
            </h5>

            <!-- 現在の勤務状態 -->
            <p class="mb-3">
                <span class="text-muted small me-2"
                      th:text="#{tenant.attendance.state.label}">現在の状態</span>
                <span class="badge"
                      th:classappend="${attendancePanel.state.name() == 'WORKING'} ? 'bg-success'
                          : (${attendancePanel.state.name() == 'ON_BREAK'} ? 'bg-warning text-dark' : 'bg-secondary')"
                      th:text="#{__${'tenant.attendance.state.' + attendancePanel.state}__}">勤務外</span>
            </p>

            <!-- 打刻ボタン（種別ごとに独立フォーム・CSRFは自動付与） -->
            <div class="d-flex flex-wrap gap-2">
                <form th:action="@{/attendance/punch}" method="post" class="m-0">
                    <input type="hidden" name="punchType" value="CLOCK_IN" />
                    <button type="submit" class="btn btn-success"
                            th:disabled="${!attendancePanel.canClockIn}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>
                        <span th:text="#{tenant.attendance.button.clockIn}">出勤</span>
                    </button>
                </form>
                <form th:action="@{/attendance/punch}" method="post" class="m-0">
                    <input type="hidden" name="punchType" value="BREAK_START" />
                    <button type="submit" class="btn btn-outline-secondary"
                            th:disabled="${!attendancePanel.canBreakStart}">
                        <i class="bi bi-cup-hot me-1"></i>
                        <span th:text="#{tenant.attendance.button.breakStart}">休憩開始</span>
                    </button>
                </form>
                <form th:action="@{/attendance/punch}" method="post" class="m-0">
                    <input type="hidden" name="punchType" value="BREAK_END" />
                    <button type="submit" class="btn btn-outline-secondary"
                            th:disabled="${!attendancePanel.canBreakEnd}">
                        <i class="bi bi-arrow-return-left me-1"></i>
                        <span th:text="#{tenant.attendance.button.breakEnd}">休憩終了</span>
                    </button>
                </form>
                <form th:action="@{/attendance/punch}" method="post" class="m-0">
                    <input type="hidden" name="punchType" value="CLOCK_OUT" />
                    <button type="submit" class="btn btn-danger"
                            th:disabled="${!attendancePanel.canClockOut}">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        <span th:text="#{tenant.attendance.button.clockOut}">退勤</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- 本日のセッション（進行中または直近完了）                       -->
    <!-- ============================================================ -->
    <div class="card mb-4" th:if="${attendancePanel != null}">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-list-check me-2 text-primary"></i>
                <span th:text="#{tenant.attendance.session.heading}">直近のセッション</span>
            </h5>

            <!-- 打刻なし -->
            <p class="text-muted small mb-0"
               th:if="${#lists.isEmpty(attendancePanel.punches)}"
               th:text="#{tenant.attendance.session.empty}">
                まだ打刻がありません。
            </p>

            <!-- 打刻一覧 -->
            <table class="table table-sm mb-2" th:unless="${#lists.isEmpty(attendancePanel.punches)}">
                <thead>
                    <tr>
                        <th scope="col" th:text="#{tenant.attendance.session.col.type}">種別</th>
                        <th scope="col" th:text="#{tenant.attendance.session.col.time}">時刻</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${attendancePanel.punches}">
                        <td th:text="#{__${'tenant.attendance.punchType.' + row.punchType}__}">出勤</td>
                        <td th:text="${row.timeText}">06/18 09:00</td>
                    </tr>
                </tbody>
            </table>

            <!-- 表示タイムゾーンの注記 -->
            <p class="text-muted small mb-0"
               th:unless="${#lists.isEmpty(attendancePanel.punches)}">
                <i class="bi bi-info-circle me-1"></i>
                <span th:text="#{tenant.attendance.timezone.note}">表示時刻のタイムゾーン</span>
                <code th:text="${attendancePanel.timezoneId}">Asia/Tokyo</code>
            </p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- テナント情報カード                                            -->
    <!-- ============================================================ -->
    <div class="card mb-4" th:if="${tenant != null}">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-building me-2 text-primary"></i>
                <span th:text="#{tenant.dashboard.tenant.title}">テナント情報</span>
            </h5>
            <dl class="row mb-0 small">
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.tenant.name}">テナント名</dt>
                <dd class="col-sm-9" th:text="${tenant.name}">-</dd>
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.tenant.slug}">識別子</dt>
                <dd class="col-sm-9"><code th:text="${tenant.slug}">-</code></dd>
            </dl>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ログインアカウント情報カード（iss/aud/sub・ロール）          -->
    <!-- ============================================================ -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-person-badge me-2 text-primary"></i>
                <span th:text="#{tenant.dashboard.account.title}">ログインアカウント情報</span>
            </h5>
            <dl class="row mb-3 small">
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.account.iss}">Issuer</dt>
                <dd class="col-sm-9">
                    <code th:text="${principal != null ? principal.iss : ''}">-</code>
                </dd>
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.account.aud}">Audience</dt>
                <dd class="col-sm-9">
                    <code th:text="${principal != null ? principal.aud : ''}">-</code>
                </dd>
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.account.sub}">Subject</dt>
                <dd class="col-sm-9">
                    <code th:text="${principal != null ? principal.sub : ''}">-</code>
                </dd>
            </dl>

            <!-- 付与ロール（バッジ表示） -->
            <div th:if="${principal != null}">
                <span class="text-muted small me-2" th:text="#{tenant.dashboard.account.roles}">
                    付与ロール
                </span>
                <span th:each="auth : ${principal.authorities}"
                      class="badge bg-secondary me-1"
                      th:text="${auth.authority}">ROLE</span>
            </div>
        </div>
    </div>

</div>

<!-- 共通フッタ -->
<footer th:replace="~{tenant/fragments/layout :: footer}"></footer>

<!-- 共通JS -->
<th:block th:replace="~{tenant/fragments/layout :: scripts}"></th:block>
</body>
</html>
