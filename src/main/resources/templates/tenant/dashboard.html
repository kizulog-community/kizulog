<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="#{tenant.dashboard.title}">KizuLog Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body { background-color: #f8f9fa; }
        .dashboard-container { max-width: 900px; }
    </style>
</head>
<body>

<!-- ============================================================ -->
<!-- ヘッダ（ブランド + ログアウト）                              -->
<!-- ============================================================ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-shield-lock-fill me-2"></i>KizuLog
        </span>
        <div class="d-flex align-items-center">
            <span class="text-white-50 me-3 small d-none d-sm-inline"
                  th:if="${tenant != null}"
                  th:text="${tenant.name}">テナント名</span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    <span th:text="#{tenant.dashboard.logout}">ログアウト</span>
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container dashboard-container py-4">

    <!-- ============================================================ -->
    <!-- ページヘッダ                                                  -->
    <!-- ============================================================ -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            <i class="bi bi-speedometer2 me-2"></i>
            <span th:text="#{tenant.dashboard.title}">ダッシュボード</span>
        </h1>
    </div>

    <!-- ============================================================ -->
    <!-- ウェルカムカード                                              -->
    <!-- ============================================================ -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-emoji-smile me-2 text-primary"></i>
                <span th:text="#{tenant.dashboard.welcome.title}">ようこそ</span>
            </h5>
            <p class="card-text text-muted mb-0"
               th:text="#{tenant.dashboard.welcome.description}">
                KizuLog にログインしました。打刻などの機能は順次提供予定です。
            </p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- テナント情報カード                                            -->
    <!-- ============================================================ -->
    <div class="card mb-4" th:if="${tenant != null}">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-building me-2 text-primary"></i>
                <span th:text="#{tenant.dashboard.tenant.title}">テナント情報</span>
            </h5>
            <dl class="row mb-0 small">
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.tenant.name}">テナント名</dt>
                <dd class="col-sm-9" th:text="${tenant.name}">-</dd>
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.tenant.slug}">識別子</dt>
                <dd class="col-sm-9"><code th:text="${tenant.slug}">-</code></dd>
            </dl>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ログインアカウント情報カード                                  -->
    <!-- ============================================================ -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-person-badge me-2 text-primary"></i>
                <span th:text="#{tenant.dashboard.account.title}">ログインアカウント情報</span>
            </h5>
            <dl class="row mb-3 small">
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.account.iss}">Issuer</dt>
                <dd class="col-sm-9">
                    <code th:text="${principal != null ? principal.iss : ''}">-</code>
                </dd>
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.account.aud}">Audience</dt>
                <dd class="col-sm-9">
                    <code th:text="${principal != null ? principal.aud : ''}">-</code>
                </dd>
                <dt class="col-sm-3 text-muted" th:text="#{tenant.dashboard.account.sub}">Subject</dt>
                <dd class="col-sm-9">
                    <code th:text="${principal != null ? principal.sub : ''}">-</code>
                </dd>
            </dl>

            <!-- 付与ロール（バッジ表示） -->
            <div th:if="${principal != null}">
                <span class="text-muted small me-2" th:text="#{tenant.dashboard.account.roles}">
                    付与ロール
                </span>
                <span th:each="auth : ${principal.authorities}"
                      class="badge bg-secondary me-1"
                      th:text="${auth.authority}">ROLE</span>
            </div>
        </div>
    </div>

    <p class="text-center text-muted small mb-0">
        <i class="bi bi-info-circle me-1"></i>
        <span th:text="#{tenant.dashboard.footer}">
            打刻などのテナント業務機能は今後のリリースで提供されます。
        </span>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
