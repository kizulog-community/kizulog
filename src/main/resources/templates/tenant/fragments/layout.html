<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">

<!-- ============================================================ -->
<!-- head フラグメント: 共通CSS/meta                              -->
<!-- 呼び出し側で <head th:replace="~{tenant/fragments/layout :: head(title='...')}"> -->
<!-- ============================================================ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <title th:text="${title}">KizuLog</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />

    <!-- Bootstrap Icons (CDN) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- 共通スタイル（システム側 layout.html と統一） -->
    <style>
        body {
            font-size: 0.95rem;
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: 600;
        }
        .navbar-brand i {
            font-size: 1.25rem;
        }
        /* ヘッダのユーザ表示ドロップダウン */
        .navbar-user-display {
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-dropdown-toggle::after {
            margin-left: 0.4rem;
        }
        .user-dropdown-toggle {
            color: rgba(255, 255, 255, 0.95);
            text-decoration: none;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            transition: background-color 0.15s ease;
            border: 1px solid transparent;
        }
        .user-dropdown-toggle:hover,
        .user-dropdown-toggle:focus {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .card {
            border: 1px solid #dee2e6;
        }
        .app-footer {
            background-color: #ffffff;
        }
    </style>
</head>

<body>

<!-- ============================================================ -->
<!-- header フラグメント: ヘッダ                                  -->
<!--                                                              -->
<!-- ユーザ表示名ドロップダウン（「姓 名（所属）」クリックで展開） -->
<!-- 内にプロフィール設定リンクとログアウトを格納。               -->
<!-- システム側 layout.html の header と同一の表示ロジック。       -->
<!--                                                              -->
<!-- 表示名構成:                                                  -->
<!-- - 姓・名・ミドルネームのいずれかあり → 姓 名 [middle]        -->
<!-- - 全て無い場合 → email                                       -->
<!-- - email も無い場合 → アイコンのみ + 「アカウント」テキスト   -->
<!-- - 所属あり → 表示名の後ろに（所属）                          -->
<!--                                                              -->
<!-- Spring 7/Thymeleaf 3.1.5 のSpEL厳格化対応:                   -->
<!--   th:if 内は必ず ${var != null} の形で boolean 化して評価。   -->
<!-- ============================================================ -->
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-shield-lock-fill me-2"></i>
            <span th:text="#{tenant.layout.brand}">KizuLog</span>
        </a>
        <div class="d-flex align-items-center">

            <!-- ユーザ表示名ドロップダウン -->
            <div class="dropdown" th:if="${userDisplay != null}">
                <a href="#"
                   class="dropdown-toggle user-dropdown-toggle small navbar-user-display"
                   role="button"
                   id="userDisplayDropdown"
                   data-bs-toggle="dropdown"
                   aria-expanded="false">
                    <i class="bi bi-person-circle me-1"></i>

                    <!-- 姓・名・ミドルネームのいずれかが取れている場合 -->
                    <th:block th:unless="${userDisplay.nameEmpty}">
                        <span th:if="${userDisplay.familyName != null}"
                              th:text="${userDisplay.familyName}">山田</span>
                        <th:block th:if="${userDisplay.familyName != null and userDisplay.givenName != null}"> </th:block>
                        <span th:if="${userDisplay.givenName != null}"
                              th:text="${userDisplay.givenName}">太郎</span>
                        <span th:if="${userDisplay.middleName != null}"
                              class="ms-1"
                              th:text="${userDisplay.middleName}">M.</span>
                    </th:block>

                    <!-- 名前要素が一切無い場合: email にフォールバック -->
                    <span th:if="${userDisplay.nameEmpty and userDisplay.email != null}"
                          th:text="${userDisplay.email}">taro@example.com</span>

                    <!-- emailもない場合: 「アカウント」テキスト -->
                    <span th:if="${userDisplay.nameEmpty and userDisplay.email == null}"
                          th:text="#{tenant.layout.user.unknown}">アカウント</span>

                    <!-- 所属（あれば括弧書きで） -->
                    <span th:if="${userDisplay.organization != null}"><!--
                   --><span th:text="#{tenant.layout.organizationPrefix}">（</span><!--
                   --><span th:text="${userDisplay.organization}">開発部</span><!--
                   --><span th:text="#{tenant.layout.organizationSuffix}">）</span>
                    </span>
                </a>

                <!-- ドロップダウンメニュー -->
                <ul class="dropdown-menu dropdown-menu-end shadow-sm"
                    aria-labelledby="userDisplayDropdown">
                    <li>
                        <a class="dropdown-item" th:href="@{/my-profile}">
                            <i class="bi bi-person-gear me-2"></i>
                            <span th:text="#{tenant.menu.myProfile}">プロフィール設定</span>
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit"
                                    class="dropdown-item text-danger">
                                <i class="bi bi-box-arrow-right me-2"></i>
                                <span th:text="#{tenant.layout.logoutButton}">ログアウト</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>

            <!-- userDisplay が無い場合（未認証 or 取得失敗）でもログアウトボタンは表示 -->
            <form th:if="${userDisplay == null}"
                  th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    <span th:text="#{tenant.layout.logoutButton}">ログアウト</span>
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- ============================================================ -->
<!-- footer フラグメント: 共通フッタへのファサード                 -->
<!-- 呼び出し側で <footer th:replace="~{tenant/fragments/layout :: footer}"> -->
<!-- ============================================================ -->
<footer th:fragment="footer" th:replace="~{common/fragments/footer :: footer}">
</footer>

<!-- ============================================================ -->
<!-- scripts フラグメント: 共通JS                                  -->
<!-- 呼び出し側で <script th:replace="~{tenant/fragments/layout :: scripts}"> -->
<!-- ============================================================ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</th:block>

</body>
</html>
