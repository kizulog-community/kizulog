<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="#{tenant.invite.error.title}">KizuLog Invitation Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body { background-color: #f8f9fa; }
        .invite-card { max-width: 480px; margin: 60px auto; }
    </style>
</head>
<body>

<div class="invite-card px-3">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">
            <i class="bi bi-shield-lock-fill me-2"></i>KizuLog
        </h1>
        <p class="text-muted mb-0" th:text="#{tenant.invite.error.subtitle}">
            Invitation
        </p>
    </div>

    <div class="card shadow-sm border-danger">
        <div class="card-body p-4 text-center">
            <div class="mb-3">
                <i class="bi bi-exclamation-octagon-fill text-danger"
                   style="font-size: 3rem;"></i>
            </div>

            <h5 class="card-title mb-3" th:text="#{tenant.invite.error.heading}">
                招待を受諾できません
            </h5>

            <!-- エラーコード別メッセージ -->
            <p class="mb-3">
                <span th:if="${errorCode == 'INVALID_TOKEN'}"
                      th:text="#{tenant.invite.error.INVALID_TOKEN}">
                    無効な招待リンクです。
                </span>
                <span th:if="${errorCode == 'EXPIRED'}"
                      th:text="#{tenant.invite.error.EXPIRED}">
                    この招待は有効期限を過ぎています。
                </span>
                <span th:if="${errorCode == 'ALREADY_USED'}"
                      th:text="#{tenant.invite.error.ALREADY_USED}">
                    この招待は既に使用されています。
                </span>
                <span th:if="${errorCode == 'CANCELLED'}"
                      th:text="#{tenant.invite.error.CANCELLED}">
                    この招待は取消されました。
                </span>
                <span th:if="${errorCode == 'OIDC_FAILED'}"
                      th:text="#{tenant.invite.error.OIDC_FAILED}">
                    OIDC 認証に失敗しました。
                </span>
                <span th:if="${errorCode == 'IDENTITY_EXISTS'}"
                      th:text="#{tenant.invite.error.IDENTITY_EXISTS}">
                    このアカウントは既にこのテナントに登録されています。通常のログインをお試しください。
                </span>
                <span th:if="${errorCode == 'INVITATION_NOT_FOUND'}"
                      th:text="#{tenant.invite.error.INVITATION_NOT_FOUND}">
                    招待の処理中にエラーが発生しました。
                </span>
                <span th:if="${errorCode == 'TENANT_MISMATCH'}"
                      th:text="#{tenant.invite.error.TENANT_MISMATCH}">
                    この招待リンクはこのテナントのものではありません。
                </span>
                <span th:if="${errorCode == 'UNKNOWN'}"
                      th:text="#{tenant.invite.error.UNKNOWN}">
                    招待を処理できませんでした。発行者に連絡してください。
                </span>
            </p>

            <div class="text-muted small">
                <i class="bi bi-info-circle me-1"></i>
                <span th:text="#{tenant.invite.error.contact}">
                    問題が解決しない場合は、招待を発行した管理者に連絡してください。
                </span>
            </div>

            <!-- IDENTITY_EXISTS時のみ、ログイン画面へのリンクを表示 -->
            <div th:if="${errorCode == 'IDENTITY_EXISTS'}" class="mt-4">
                <a th:href="@{/login}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    <span th:text="#{tenant.invite.error.goToLogin}">ログイン画面へ</span>
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
