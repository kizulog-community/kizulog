# ============================================================
# KizuLog 共通設定
# ============================================================

# アプリケーション基本設定
spring.application.name=kizulog

# JPA設定
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway設定
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# メッセージソース設定
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# リバースプロキシ設定
server.forward-headers-strategy=native

# システムホスト設定
kizulog.system.host=${KIZULOG_SYSTEM_HOST:kizu-sys.dev.internal}

# OIDCプロファイル設定/標準: name > preferred_username > email
# 【廃止予定: T.0シリーズ以降】
# プロバイダ毎の system_oidc_providers.claims_mapping に置き換えられた。
# 本設定は後方互換のため残しているが、新規参照は禁止。将来削除予定。
kizulog.oidc.profile.display-name-claims=name,preferred_username,email

# OIDCプロファイル設定/所属名: OIDC標準にはないため、Keycloak等のカスタムクレーム名を指定
# 【廃止予定: T.0シリーズ以降】
# プロバイダ毎の system_oidc_providers.claims_mapping に置き換えられた。
# 本設定は後方互換のため残しているが、新規参照は禁止。将来削除予定。
kizulog.oidc.profile.organization-claim=organization

# キャッシュに保存するクレームのホワイトリスト
# 【T.0シリーズ以降も継続使用】
# claims_mapping で指定したクレームキーは、必ず当ホワイトリストにも含めること。
kizulog.oidc.profile.cached-claims=name,given_name,family_name,middle_name,nickname,preferred_username,email,email_verified,locale,zoneinfo,picture,updated_at,organization
