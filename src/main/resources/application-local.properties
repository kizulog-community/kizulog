# ============================================================
# KizuLog ローカル開発環境設定
# ============================================================

# DB接続設定
spring.datasource.url=jdbc:postgresql://localhost:5432/kizulog
spring.datasource.username=kizulog
spring.datasource.password=${DB_PASSWORD:kizulog_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA設定
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ログ設定
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.io.github.kizulog_community.kizulog=DEBUG

# 暗号化方式(AES-256-GCM)
kizulog.crypto.secret-key=${CRYPTO_SECRET_KEY:kizulog-dev-secret-key-32chars!!}
